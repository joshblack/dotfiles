wrappers = { cargo = { command = "mbx", env = { MBX_CARGO_SHIM_MODE = "1" } } }

[tools]
"cargo:cargo-nextest" = "0.9.151"
"npm:@github/copilot" = "latest"
"npm:@primer/mcp" = "latest"
"npm:agent-browser" = "latest"
"npm:corepack" = "latest"
"npm:next-devtools-mcp" = "latest"
bun = "1.4.4"
hunk = "latest"
node = "26"
pi = "latest"
python = "latest"
rust = "1.100.0"

[settings]
idiomatic_version_file_enable_tools = ["rust"]

[tool_alias]
npm = "npm:npm"
pnpm = "npm:pnpm"

