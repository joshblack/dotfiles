unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Set prefix to a.
unbind C-b
set -g prefix C-\\
bind C-\\ send-prefix

# Mouse can be used to select panes, select windows (by clicking on the status
# bar), resize panes. For default bindings see `tmux list-keys`.
set -g mouse on

# Bindings:
# - to see current bindings:
#   tmux list-keys

# https://unix.stackexchange.com/questions/197391/background-color-mismatch-in-vim-and-tmux
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Vim-like key bindings for pane navigation (default uses cursor keys).
unbind-key h
bind-key h select-pane -L
unbind-key j
bind-key j select-pane -D
unbind-key k
bind-key k select-pane -U
unbind-key l # normally used for last-window
bind-key l select-pane -R

# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin "janoamaral/tokyo-night-tmux"
set -g @plugin 'tmux-plugins/tmux-yank'

# set -g @nord_tmux_show_status_content "0"
set -g @tokyo-night-tmux_theme night   # night (default) | storm | moon | day
# set -g @tokyo-night-tmux_transparent 1 # transparent background
set -g @tokyo-night-tmux_show_git 0             # local git status
set -g @tokyo-night-tmux_show_wbg 0             # GitHub / GitLab stats
set -g @tokyo-night-tmux_show_netspeed 0        # network speed
set -g @tokyo-night-tmux_show_battery_widget 0  # battery level
set -g @tokyo-night-tmux_show_music 0           # now playing
# set -g @tokyo-night-tmux_show_path 1            # current path
set -g @tokyo-night-tmux_show_hostname 0        # machine hostname

run '~/.tmux/plugins/tpm/tpm'

# Bars
set -g status-left "#[fg=black,bg=blue,bold] #S #[fg=blue,bg=black,nobold,noitalics,nounderscore] "
set -g status-right ""

# Windows
set -g window-status-separator ""
set -g @window-status-bell-bg "#ff9e64"
set -g @window-status-bell-fg "#1A1B26"
set -g window-status-bell-style "fg=#1A1B26,bg=#ff9e64,noreverse"
set -g window-status-format "#[fg=#{?window_bell_flag,#{@window-status-bell-bg},#1A1B26},bg=#{?window_bell_flag,#{@window-status-bell-bg},#1A1B26},nobold,noitalics,nounderscore] #[fg=#{?window_bell_flag,#{@window-status-bell-fg},#a9b1d6},bg=#{?window_bell_flag,#{@window-status-bell-bg},#1A1B26}] #I #[fg=#{?window_bell_flag,#{@window-status-bell-fg},#a9b1d6},bg=#{?window_bell_flag,#{@window-status-bell-bg},#1A1B26},nobold,noitalics,nounderscore]#[fg=#{?window_bell_flag,#{@window-status-bell-fg},#a9b1d6},bg=#{?window_bell_flag,#{@window-status-bell-bg},#1A1B26}]#{=20:pane_title} #F #[fg=#{?window_bell_flag,#{@window-status-bell-bg},#1A1B26},bg=#{?window_bell_flag,#{@window-status-bell-bg},#1A1B26},nobold,noitalics,nounderscore] "
set -g window-status-current-format "#[fg=#1A1B26,bg=#{?window_bell_flag,#{@window-status-bell-bg},#2A2F41},nobold,noitalics,nounderscore] #[fg=#{?window_bell_flag,#{@window-status-bell-fg},#73daca},bg=#{?window_bell_flag,#{@window-status-bell-bg},#2A2F41}] #I #[fg=#{?window_bell_flag,#{@window-status-bell-fg},#a9b1d6},bg=#{?window_bell_flag,#{@window-status-bell-bg},#2A2F41},nobold,noitalics,nounderscore]#[fg=#{?window_bell_flag,#{@window-status-bell-fg},#a9b1d6},bg=#{?window_bell_flag,#{@window-status-bell-bg},#2A2F41}]#{=20:pane_title} #F #[fg=#{?window_bell_flag,#{@window-status-bell-bg},#2A2F41},bg=#{?window_bell_flag,#{@window-status-bell-bg},#1A1B26},nobold,noitalics,nounderscore] "

# Select windows with command plus number
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Go to last window
bind o select-window -l

# Title
set -g set-titles on
set -g set-titles-string '#T'

# Window name
set -g allow-rename on
set -g automatic-rename off
